name: Continuous Integration & Deployment Pipeline

on:
  push:
    branches: [ main, master, production ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------
  # Job 1: Build & Type-Check Verification
  # ----------------------------------------------------
  build-and-test:
    name: Type-Check & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root & Workspace Dependencies
        run: npm ci

      - name: Generate Prisma Database Client
        run: npm run db:generate

      - name: Compile Backend TypeScript
        run: npm run build:server

      - name: Compile Frontend TypeScript & Vite Bundle
        run: npm run build:client

  # ----------------------------------------------------
  # Job 2: Docker Build Verification
  # ----------------------------------------------------
  docker-verification:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Unified Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: restaurant-management-system:latest
