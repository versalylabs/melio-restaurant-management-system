services:
  postgres:
    image: postgres:16-alpine
    container_name: rms-postgres-dev
    environment:
      POSTGRES_USER: rms_dev
      POSTGRES_PASSWORD: rms_dev_password
      POSTGRES_DB: rms_dev_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rms-redis-dev
    ports:
      - "6379:6379"

volumes:
  postgres_dev_data:
